<!DOCTYPE html>
<html>
<head>
  <title>Button with Sound & Animation</title>
  <style>
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      transition: background-color 0.3s, color 0.3s;
    }

    button:hover {
      background-color: #28a745;
      color: white;
    }

    /* Animation class */
    .bounce {
      animation: bounce 0.3s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<!-- Button -->
<button onclick="playClickEffect(this)">Hello</button>

<!-- Sound effect -->
<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3" preload="auto"></audio>

<script>
  function playClickEffect(button) {
    // Change text
    button.innerText = 'Clicked!';

    // Play sound
    document.getElementById('clickSound').play();

    // Animate
    button.classList.add('bounce');
    setTimeout(() => button.classList.remove('bounce'), 300);
  }
</script>

</body>
</html>
